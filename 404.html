<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Taily Metal</title>
    <meta name="description" content="The page you are looking for does not exist." />
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --bg-color: #1a1a1a;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --accent-copper: #d97706;
        --accent-steel: #334155;
        --blueprint-line: rgba(51, 65, 85, 0.3);
      }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: var(--bg-color);
        background-image: 
          linear-gradient(var(--blueprint-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--blueprint-line) 1px, transparent 1px);
        background-size: 40px 40px;
        color: var(--text-primary);
        text-align: center;
      }
      .container {
        padding: 3rem;
        background: rgba(26, 26, 26, 0.8);
        border: 1px solid var(--accent-steel);
        border-radius: 4px;
        backdrop-filter: blur(4px);
        max-width: 500px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        font-weight: bold;
        text-decoration: none;
        color: var(--text-primary);
        margin-bottom: 2.5rem;
        font-size: 1.25rem;
        letter-spacing: -0.025em;
      }
      .logo-box {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent-copper);
        font-size: 1rem;
        font-weight: 900;
        color: white;
      }
      h1 { 
        font-size: 8rem; 
        margin: 0; 
        color: var(--accent-copper); 
        line-height: 1;
        font-weight: 800;
        opacity: 0.9;
      }
      p { 
        font-size: 1.5rem; 
        margin: 1rem 0 2.5rem; 
        color: var(--text-secondary);
        font-weight: 400;
      }
      .btn {
        display: inline-block;
        background: var(--accent-steel);
        color: var(--text-primary);
        padding: 1rem 2rem;
        border: 1px solid var(--accent-copper);
        border-radius: 4px;
        text-decoration: none;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: all 0.2s ease;
      }
      .btn:hover {
        background: var(--accent-copper);
        color: white;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="/" class="brand">
        <span class="logo-box">T</span>
        Taily Metal
      </a>
      <h1>404</h1>
      <p>ENGINEERING ERROR: PAGE NOT FOUND</p>
      <a href="/" class="btn">Return to Base</a>
    </div>
  </body>
</html>
